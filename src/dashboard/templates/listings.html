{% extends "base.html" %}
{% import "_macros.html" as m %}
{% block title %}Listings · Ignis Sport Hunter{% endblock %}
{% block body %}
<h2 class="section-title">Listings ({{ listings|length }})</h2>

<form class="filters" method="get" action="/listings">
  <label>Min match
    <input type="number" name="min_confidence" value="{{ filters.min_confidence }}" style="width:80px"></label>
  <label>Country
    <input type="text" name="country" value="{{ filters.country or '' }}" placeholder="DE" style="width:70px"></label>
  <label>Max price €
    <input type="number" name="max_price" value="{{ filters.max_price or '' }}" style="width:100px"></label>
  <label>Min price €
    <input type="number" name="min_price" value="{{ filters.min_price or '' }}" style="width:100px"></label>
  <label>Max km
    <input type="number" name="max_mileage" value="{{ filters.max_mileage or '' }}" style="width:100px"></label>
  <label>Min year
    <input type="number" name="min_year" value="{{ filters.min_year or '' }}" style="width:80px"></label>
  <label>Seller
    <select name="seller_type">
      <option value="">any</option>
      <option value="dealer" {{ 'selected' if filters.seller_type=='dealer' }}>dealer</option>
      <option value="private" {{ 'selected' if filters.seller_type=='private' }}>private</option>
    </select></label>
  <label>Drive
    <select name="lhd">
      <option value="">any</option>
      <option value="LHD" {{ 'selected' if filters.lhd=='LHD' }}>LHD</option>
      <option value="RHD" {{ 'selected' if filters.lhd=='RHD' }}>RHD</option>
    </select></label>
  <label>Status
    <select name="status">
      <option value="">any</option>
      {% for st in ['ACTIVE','MAYBE_ACTIVE','SOLD','EXPIRED','REMOVED','ARCHIVED'] %}
      <option value="{{ st }}" {{ 'selected' if filters.status==st }}>{{ st }}</option>{% endfor %}
    </select></label>
  <label>Sort
    <select name="order_by">
      {% for o in ['opportunity','confidence','newest','price'] %}
      <option value="{{ o }}" {{ 'selected' if filters.order_by==o }}>{{ o }}</option>{% endfor %}
    </select></label>
  <button class="primary" type="submit">Filter</button>
</form>

<div class="card">{{ m.listing_table(listings) }}</div>
{% endblock %}
