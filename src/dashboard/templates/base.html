<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Ignis Sport Hunter{% endblock %}</title>
  <style>
    :root { --bg:#0f1115; --card:#181b22; --muted:#8b93a7; --fg:#e6e9ef;
            --accent:#ffb020; --good:#3ddc84; --bad:#ff5c5c; --line:#262a35; }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:var(--fg);
           font:14px/1.5 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
    a { color:var(--accent); text-decoration:none; }
    a:hover { text-decoration:underline; }
    header { background:#12151c; border-bottom:1px solid var(--line);
             padding:10px 20px; display:flex; gap:18px; align-items:center;
             flex-wrap:wrap; position:sticky; top:0; z-index:5; }
    header .brand { font-weight:700; color:var(--accent); }
    header nav a { color:var(--fg); margin-right:6px; }
    .wrap { max-width:1200px; margin:0 auto; padding:18px 20px; }
    .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr));
            gap:12px; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:10px;
            padding:14px; }
    .stat { font-size:26px; font-weight:700; }
    .stat.small { font-size:20px; }
    .muted { color:var(--muted); }
    .pill { display:inline-block; padding:1px 8px; border-radius:999px;
            font-size:12px; border:1px solid var(--line); }
    .conf-hi { color:var(--good); } .conf-mid { color:var(--accent); }
    .conf-lo { color:var(--muted); }
    table { width:100%; border-collapse:collapse; }
    th, td { text-align:left; padding:7px 8px; border-bottom:1px solid var(--line);
             vertical-align:top; }
    th { color:var(--muted); font-weight:600; font-size:12px; text-transform:uppercase;
         letter-spacing:.04em; }
    .section-title { margin:22px 0 8px; font-size:16px; }
    form.inline { display:inline; }
    input, select, button { background:#0d1015; color:var(--fg);
            border:1px solid var(--line); border-radius:6px; padding:6px 8px; }
    button { cursor:pointer; }
    button.primary { background:var(--accent); color:#111; border:none; font-weight:600; }
    .filters { display:flex; gap:8px; flex-wrap:wrap; align-items:end; margin-bottom:12px; }
    .filters label { display:flex; flex-direction:column; font-size:12px; color:var(--muted); gap:3px; }
    .bar { height:8px; background:#0d1015; border-radius:6px; overflow:hidden; }
    .bar > span { display:block; height:100%; background:var(--accent); }
    code { background:#0d1015; padding:1px 5px; border-radius:4px; }
  </style>
</head>
<body>
  <header>
    <span class="brand">🚗 IGNIS SPORT HUNTER</span>
    <nav>
      <a href="/">Overview</a>
      <a href="/listings">Listings</a>
      <a href="/sources">Sources</a>
      <a href="/health">Health &amp; Coverage</a>
    </nav>
    <span style="margin-left:auto" class="muted">Find the car before everyone else.</span>
  </header>
  <div class="wrap">
    {% block body %}{% endblock %}
  </div>
</body>
</html>
