[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ignis-sport-hunter"
version = "0.1.0"
description = "Europe-wide discovery system that continuously hunts for rare Suzuki Ignis Sport (HT81S) listings, prioritising long-tail sources."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ignis Hunter" }]
dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "SQLAlchemy>=2.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
    "APScheduler>=3.10",
    "feedparser>=6.0",
    "Jinja2>=3.1",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
ai = ["anthropic>=0.40"]
images = ["Pillow>=10.0", "ImageHash>=4.3"]
browser = ["playwright>=1.42"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.4"]

[project.scripts]
ignis-hunter = "src.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"
