# Two long-running services sharing one persistent SQLite volume:
#   * scheduler — the 4×/day scans, daily discovery, priority sweep, backups
#   * dashboard — the web UI on :8000 (has an HTTP healthcheck)
# Both read secrets from a local .env (never committed). Data & logs persist in
# named volumes so container rebuilds never lose history.
services:
  scheduler:
    build: .
    command: python -m src.cli scheduler
    env_file: .env
    restart: unless-stopped
    volumes:
      - ignis-data:/app/data
      - ignis-logs:/app/logs
    healthcheck:
      # Scheduler is healthy if the DB is initialised and readable.
      test: ["CMD", "python", "-c", "import sqlite3,glob,sys; sys.exit(0 if glob.glob('data/*.db') else 1)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

  dashboard:
    build: .
    command: python -m src.cli dashboard --host 0.0.0.0 --port 8000
    env_file: .env
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ignis-data:/app/data
      - ignis-logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    depends_on:
      - scheduler

volumes:
  ignis-data:
  ignis-logs:
