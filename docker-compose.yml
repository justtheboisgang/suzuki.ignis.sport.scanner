# Two long-running services sharing one SQLite volume:
#   * scheduler — performs the 4×/day scans, daily discovery and backups
#   * dashboard — the web UI on :8000
# Both read secrets from a local .env (never committed).
services:
  scheduler:
    build: .
    command: python -m src.cli scheduler
    env_file: .env
    restart: unless-stopped
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs

  dashboard:
    build: .
    command: python -m src.cli dashboard --host 0.0.0.0 --port 8000
    env_file: .env
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    depends_on:
      - scheduler
